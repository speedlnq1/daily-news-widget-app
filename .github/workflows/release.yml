name: Release (dry run by default)
# Builds the installer and SHA256 checksums.
# Publishing a GitHub release happens only when the maintainer asks for it, in one of two ways:
#   - pushing a version tag (v1.2.3) while the repository variable PUBLISH_RELEASES is "true", or
#   - running this workflow by hand (Actions tab) with "publish" ticked and the tag to create.
# Every other run is a dry run: the files are only kept as a workflow artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, for example v1.0.0 (must match package.json version)'
        required: false
        type: string
      publish:
        description: 'Publish a GitHub release (leave off for a dry run)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: pwsh
        env: { TAG: '${{ inputs.tag || github.ref_name }}' }
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$v" -ne $env:TAG) { throw "Tag $env:TAG does not match package.json version $v" }
      - name: Build installer (never publishes from here)
        run: npx electron-builder --win nsis --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - name: SHA256 checksums
        shell: pwsh
        run: |
          Set-Location dist
          $lines = Get-ChildItem Daily-News-Widget-Setup-*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          }
          # LF line endings so `sha256sum -c` works on Linux and macOS too
          [IO.File]::WriteAllText("$PWD/SHA256SUMS.txt", (($lines -join "`n") + "`n"))
          Get-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/Daily-News-Widget-Setup-*.exe
            dist/SHA256SUMS.txt

  publish:
    # Skipped (dry run) unless the maintainer asked for a release (see the top of this file).
    needs: build
    if: (startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_RELEASES == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish && inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: release-files, path: release }
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          cat > notes.md <<'NOTES'
          **Unsigned pre-release of the Windows installer.**

          - **Windows SmartScreen will warn "Unknown publisher".** The installer is not code-signed yet. If you trust this source and the checksum below matches, choose *More info > Run anyway*. Or build it from source (see the README).
          - **No automatic updates yet.** Install newer releases by hand.
          - **Verify your download:** compare `Get-FileHash .\Daily-News-Widget-Setup-<version>.exe -Algorithm SHA256` in PowerShell with the line in `SHA256SUMS.txt`.
          - **The news is automated and not fact-checked.** Stories are collected from public feeds of trusted outlets and ranked with simple rules. Always read the source.
          - Windows only. Free and open source (MIT).
          NOTES
          gh release create "$TAG" release/* \
            --repo "$REPO" \
            --target "$SHA" \
            --title "Daily News Widget $TAG" \
            --prerelease \
            --notes-file notes.md
